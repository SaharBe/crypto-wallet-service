apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-wallet-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/SaharBe/crypto-wallet-service.git'
    targetRevision: HEAD
    path: k8s/components
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Same CRD-bootstrap issue as root-app: external-secret.yaml here uses
      # ClusterSecretStore/ExternalSecret, whose CRDs are installed by a
      # separate Application (external-secrets) with its own reconcile loop.
      - SkipDryRunOnMissingResource=true
