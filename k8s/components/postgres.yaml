apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  labels:
    app: postgres
spec:
  replicas: 1
  # A ReadWriteOnce EBS volume can only be attached to one node at a time —
  # Recreate avoids the new Pod getting stuck waiting on a volume the old
  # Pod (on a different node) hasn't released yet, which is what
  # RollingUpdate's default "bring up the new one first" would risk here.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # No ServiceAccount token (PLAT-521), see wallet-service.yaml.
      automountServiceAccountToken: false
      # Non-root (PLAT-512): runs directly as the image's `postgres` user
      # (uid/gid 999) instead of starting as root and dropping to it via gosu.
      # The entrypoint supports this: it skips its root-only chown steps and
      # still chmods PGDATA back to 0700 on every start, which postgres
      # insists on and which fsGroup's g+rwx would otherwise break.
      # Existing data is unaffected: pgdata was already owned by 999.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        # Makes a freshly provisioned EBS volume's root dir (root-owned ext4)
        # group-writable so the non-root entrypoint can mkdir PGDATA in it.
        # OnRootMismatch: chgrp the volume recursively only the first time,
        # not on every Pod start.
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # k8s/apps/kyverno-policies/disallow-missing-limits.yaml requires
          # every container to declare both — this container never had to
          # before because its only prior Pod predates that policy (admission
          # control doesn't touch already-running Pods). The Recreate
          # strategy above forces a real Pod recreation on every rollout now,
          # so a future rollout without this would get rejected outright
          # (confirmed live: `FailedCreate ... require-resource-limits ...
          # CPU and memory limits are required for all containers`, 38
          # minutes of Postgres downtime until this was added).
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            # Same Vault-backed Secret wallet-service reads (ExternalSecret in
            # external-secret.yaml; CI swaps in ci-db-secret.yaml), so the DB
            # and its clients can't drift apart and no credential sits in git
            # (SEC-412). Postgres only reads these on initdb of an empty
            # PGDATA: changing the value in Vault does NOT change the password
            # of an existing database; that needs an ALTER USER as well.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: crypto-db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crypto-db-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "mydb"
            # Subdirectory, not the mount point itself: a freshly provisioned
            # EBS volume is ext4-formatted with a `lost+found` directory already
            # in it, which trips initdb's "directory exists but is not empty"
            # check on first boot. This is the fix the official postgres image
            # docs themselves recommend for exactly this case.
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
          volumeMounts:
            # 1. Mount the initialization directory into the container
            - name: postgres-init-volume
              mountPath: /docker-entrypoint-initdb.d
            # 2. Persist actual database files across Pod restarts/reschedules
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            # 3. Writable paths with a read-only root filesystem: the unix
            # socket + pid lock dir, and scratch space
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        # 3. Define the volume using the ConfigMap you created
        - name: postgres-init-volume
          configMap:
            name: postgres-init-db-script
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
