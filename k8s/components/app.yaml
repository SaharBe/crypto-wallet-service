apiVersion: v1
kind: ServiceAccount
metadata:
  name: crypto-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
  labels:
    app: node-app
    app.kubernetes.io/name: node-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-app
      app.kubernetes.io/name: node-app
  template:
    metadata:
      labels:
        app: node-app
        app.kubernetes.io/name: node-app
    spec:
      serviceAccountName: crypto-sa
      containers:
      - name: node-app
        image: saharbe/portfolio-app-node:v3
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_NAME
          value: "mydb"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: crypto-db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crypto-db-secret
              key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: node-app-service
spec:
  type: NodePort 
  selector:
    app: node-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080