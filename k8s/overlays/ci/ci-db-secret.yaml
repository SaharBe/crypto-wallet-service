# Stands in for the Vault-backed ExternalSecret (k8s/components/external-secret.yaml)
# on CI's ephemeral Kind cluster, which has no Vault or External Secrets
# Operator running. postgres.yaml and wallet-service.yaml both read
# DB_USER/DB_PASSWORD from this Secret, so the DB and its client always
# agree. The values are throwaway: they only ever exist on CI's Kind cluster.
apiVersion: v1
kind: Secret
metadata:
  name: crypto-db-secret
  namespace: crypto-wallet-app
type: Opaque
stringData:
  DB_USER: myuser
  DB_PASSWORD: mypassword
