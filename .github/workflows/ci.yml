name: CI/CD Platform Pipeline to AWS ECR

on:
  push:
    branches: [main, master]
    paths:
      - 'services/wallet-service/**'
      - 'services/order-service/**'
      - 'services/frontend/**'
      - '.github/workflows/ci.yml'

# update-manifests pushes a pin branch and opens + merges a PR for it —
# GITHUB_TOKEN is read-only by default, so both need this explicitly. The
# repo setting "Allow GitHub Actions to create and approve pull requests"
# must also be on, or `gh pr create` is refused.
permissions:
  contents: write
  pull-requests: write

# Serialize runs on the same branch so two pushes in quick succession can't
# race each other's manifest-update commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: wallet-service
            context: ./services/wallet-service
          - name: order-service
            context: ./services/order-service
          - name: frontend
            context: ./services/frontend

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push ${{ matrix.service.name }} to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.service.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # :latest stays for manual/local convenience (`make build` parity);
          # :$IMAGE_TAG is the immutable reference the manifests below get
          # pinned to — ArgoCD deploys off that tag, never off :latest.
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ${{ matrix.service.context }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # ArgoCD (selfHeal, automated) only acts on a diff in the manifests it
  # syncs from this repo — pushing a new :latest image to ECR is invisible
  # to it, since the Deployment's `image:` string never changes. This job
  # is what actually makes a push to main deploy: it rewrites each
  # Deployment to this build's immutable commit-SHA tag and lands that on
  # main, so ArgoCD sees real drift and rolls the new pods out on its own —
  # no manual `kubectl rollout restart` needed.
  #
  # It lands via a PR it opens and merges itself, not a direct push: the
  # "Protect main branche" ruleset requires every change to main to go
  # through a PR (0 approvals), with no bypass actors, and a direct push is
  # rejected with GH013.
  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pin Deployment manifests to this build's image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          declare -A files=(
            [wallet-service]=k8s/components/wallet-service.yaml
            [order-service]=k8s/components/order-service.yaml
            [frontend]=k8s/components/frontend.yaml
          )
          for svc in "${!files[@]}"; do
            file="${files[$svc]}"
            repo="079000477935\.dkr\.ecr\.us-east-1\.amazonaws\.com/${svc}"
            sed -i -E "s#(${repo}):[A-Za-z0-9._-]+#\1:${IMAGE_TAG}#" "$file"
          done

      - name: Open & merge pin PR (skip if nothing changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Manifests already pinned to ${GITHUB_SHA} — nothing to do."
            exit 0
          fi
          branch="chore/pin-images-${GITHUB_SHA}"
          title="chore(deploy): pin images to ${GITHUB_SHA}"
          git switch -c "$branch"
          git add k8s/components/wallet-service.yaml k8s/components/order-service.yaml k8s/components/frontend.yaml
          git commit -m "$title"
          # --force only ever targets this run's own chore/ branch (never main),
          # so a re-run of the same commit replaces its earlier attempt.
          git push --force origin "HEAD:refs/heads/${branch}"
          if ! gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            body="Automated by ci.yml \`update-manifests\` (${run_url})."
            body+=" Pins the wallet-service, order-service and frontend Deployments"
            body+=" to the images built from ${GITHUB_SHA}; ArgoCD rolls the pods out once this merges."
            gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" --title "$title" --body "$body"
          fi
          # Squash keeps main's history to one "chore(deploy): pin images" commit
          # per build, as before. A merge made with GITHUB_TOKEN doesn't trigger
          # another workflow run, so this can't loop.
          # Retried: right after creation GitHub can still be computing the PR's
          # mergeability, and the merge is refused until it has.
          for attempt in 1 2 3 4 5; do
            gh pr merge "$branch" --squash && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((attempt * 5))
          done
          git push origin --delete "$branch"
