apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'registry-1.docker.io/bitnamicharts'
    chart: kafka
    targetRevision: 31.2.1
    helm:
      values: |
        replicaCount: 1
        kraft:
          enabled: true
        zookeeper:
          enabled: false
        persistence:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true