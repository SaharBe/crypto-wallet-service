apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: crypto-wallet-app
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: 079000477935.dkr.ecr.us-east-1.amazonaws.com/order-service:001ddc0beaec474ef6349ccda6d1ada365fe34fa
        imagePullPolicy: Always
        resources:
          requests:
            memory: "192Mi"
            cpu: "150m"
          limits:
            memory: "384Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000
        
        env:
        - name: PORT
          value: "3000"
        # Stable Service DNS, not a specific pod ordinal — see wallet-service.yaml.
        - name: KAFKA_BROKERS
          value: "kafka.kafka.svc.cluster.local:9092"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: crypto-db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crypto-db-secret
              key: DB_PASSWORD
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
          # k6 spike-test.js (0->300 VUs in 15s) showed "context deadline
          # exceeded" Unhealthy events at the default 1s timeout under CPU
          # contention — the process was still up and answering, just not
          # inside 1s. Verified against this cluster: with the HPA
          # (k8s/components/hpa.yaml) and the higher CPU limit above, 5s
          # gives it enough room to answer before the probe gives up.
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: crypto-wallet-app
  labels:
    app: order-service
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: order-service