apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  annotations:
    # Grafana's Deployment (via existingSecret: grafana-admin-credentials)
    # needs that Secret to exist before its pod can start. The Secret comes
    # from k8s/apps/grafana-secret.yaml's ExternalSecret, which is pinned to
    # this same wave ("1") rather than the default wave (0) — see that
    # file's comment. Sharing a wave means both are created together, so
    # this Application never has to wait behind an ExternalSecret that
    # can't turn Healthy until Vault is configured.
    #
    # Vault's monitoring-role (created by `terraform apply` in
    # terraform/vault-config, a bootstrap.sh shell step outside ArgoCD's
    # sync) may still not exist yet when this wave runs. If so, ESO retries
    # with backoff and the Secret appears a little later — bootstrap.sh's
    # final step restarts the Grafana deployment and waits on this
    # Application's health after that terraform apply completes, same as it
    # already does for crypto-wallet-app.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 65.0.0
    helm:
      values: |
        grafana:
          admin:
            existingSecret: "grafana-admin-credentials"
            userKey: "admin-user"
            passwordKey: "admin-password"
          service:
            type: ClusterIP
        # node-exporter keeps hostPID/hostNetwork by design: it reports the
        # node's processes, /proc and network, so dropping them breaks the
        # node dashboards. That's an accepted exception (architecture.md §6;
        # `monitoring` is outside require-pod-security). The chart already
        # runs it as uid 65534 with a read-only root and read-only host
        # mounts; this closes the one gap Radar flagged (PLAT-512).
        # readOnlyRootFilesystem is the chart default, repeated so the whole
        # container context reads in one place.
        prometheus-node-exporter:
          containerSecurityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        # PLAT-520: Prometheus was OOMKilled at 512Mi in a loop, even with no
        # k6 run. 184k of its 214k head series came from the EKS apiserver,
        # mostly histogram buckets that no recording rule, alert or bundled
        # dashboard reads (checked against this chart version's
        # templates/prometheus/rules-1.14 and grafana/dashboards-1.14).
        # Dropping those ~104k series is the fix; the _sum/_count series stay,
        # so averages are still available. Kept: the apiserver_request_sli_*
        # buckets (API server SLO/burn-rate rules and dashboard) and
        # workqueue_*. This list replaces the chart default (Helm doesn't merge
        # lists); the default only dropped some `le` values of
        # apiserver_request_duration_seconds_bucket, which is dropped whole here.
        kubeApiServer:
          serviceMonitor:
            metricRelabelings:
              - sourceLabels: [__name__]
                action: drop
                regex: >-
                  (etcd_request_duration_seconds|apiserver_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_storage_list_duration_seconds|apiserver_response_sizes|apiserver_watch_events_sizes)_bucket
        prometheus:
          prometheusSpec:
            # Lets k6 push its metrics (k6_vus, k6_http_req_duration_*,
            # k6_http_req_failed_rate, ...) to /api/v1/write via its
            # experimental-prometheus-rw output — k6 runs are short-lived
            # and expose nothing to scrape. tests/performance/run-in-cluster.sh
            # pushes here; feeds the crypto-wallet-performance dashboard
            # (k8s/apps/monitoring/). ClusterIP-only Service, so in-cluster
            # (or port-forwarded) writers only.
            enableRemoteWriteReceiver: true
            retention: 2d
            # Sized after the relabeling above (PLAT-520). The request matches
            # steady-state usage so the scheduler accounts for it; the limit
            # leaves room for in-cluster k6 runs, which remote-write a burst
            # of new series (tests/performance/run-in-cluster.sh).
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # See k8s/root-app.yaml for why: retry transient failures (e.g. Grafana's
    # existingSecret not landed yet) instead of leaving the sync failed until
    # the next selfHeal pass.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
