services:
  postgres-db:
    image: postgres:15
    container_name: portfolio-db-compose
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web-app:
    image: saharbe/portfolio-app-node:v1
    container_name: my-node-app-compose
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres-db
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=mydb
    depends_on:
      - postgres-db 
volumes:
  pgdata: 