# The cluster's pre-existing `gp2` StorageClass points at the legacy
# in-tree `kubernetes.io/aws-ebs` provisioner, which Kubernetes removed in
# 1.23+ (this cluster runs 1.31) — any PVC against it sits Pending forever.
# terraform/infra/ebs-csi.tf installs the real aws-ebs-csi-driver addon
# (ebs.csi.aws.com); this StorageClass is the GitOps-managed counterpart
# that actually uses it. Named "gp3" (distinct from the untracked, inert
# "gp2" object already live in the cluster) so applying this can't collide
# with it — `provisioner` is an immutable field, so reusing the name "gp2"
# here would fail to apply against the existing object instead of replacing
# it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  fsType: ext4
  # The CSI driver already tags each volume with the cluster
  # (ebs.csi.aws.com/cluster-name, kubernetes.io/cluster/<name>) and the PVC
  # it was made for; this adds the same Project tag Terraform's default_tags
  # put on everything else, so `make verify-clean` can find a leaked volume
  # by project as well as by cluster. StorageClass parameters are immutable:
  # on a cluster that already has gp3, `kubectl delete sc gp3` once and let
  # ArgoCD recreate it (existing PVs are unaffected).
  tagSpecification_1: "Project=crypto-wallet"
