# Wires Grafana's admin credentials into Vault via ESO. Lives directly under
# k8s/apps (applied as raw manifests by root-app, same pattern as
# argocd-repo-secret.yaml) rather than k8s/components, because
# k8s/components/kustomization.yaml pins a blanket `namespace:
# crypto-wallet-app` transform that would silently relocate this
# ExternalSecret out of the `monitoring` namespace.
#
# Auths as terraform/vault-config's module "monitoring" role, which is the
# only role/policy scoped to read secret/data/monitoring/grafana —
# crypto-app-role (used by ClusterSecretStore/vault-crypto-app) is not, and
# using it here is what produced the 403 permission denied.
#
# monitoring-role's bound_service_account_namespaces includes "monitoring"
# but not "external-secrets", so this must set an explicit
# serviceAccountRef into that namespace rather than falling back to the ESO
# controller's own default ServiceAccount.
#
# The `monitoring` namespace is normally created by the monitoring-stack
# Application's own CreateNamespace=true — but that's a separate,
# independently-reconciled Application, and CreateNamespace=true only ever
# auto-creates an Application's *own* destination namespace, never a
# namespace referenced by another Application's raw resources. Without an
# explicit Namespace object here, root-app's sync of the ServiceAccount/
# ExternalSecret below can hard-fail outright with "namespaces \"monitoring\"
# not found" if it runs before monitoring-stack has created it — and unlike
# the missing-CRD case SkipDryRunOnMissingResource covers, that failure
# isn't tolerated per-resource: it fails root-app's whole sync operation,
# so wave 1 (monitoring-stack, see monitoring-app.yaml) never even gets
# created and the deadlock never breaks on its own. Creating the namespace
# here too, at an earlier wave, makes root-app self-sufficient for it.
# monitoring-stack's own CreateNamespace=true then just becomes a no-op.
#
# ServiceAccount/ClusterSecretStore/ExternalSecret below are pinned to
# sync-wave "1" — the same wave as the monitoring-stack Application — for
# the same reason argocd-repo-secret.yaml's trio is: at the default wave
# (0) they'd sit in the same wave as vault/external-secrets/kafka, and
# root-app's wave gate waits for EVERY wave-0 resource to be Healthy before
# wave 1 is even created. terraform/vault-config's monitoring-role doesn't
# exist until bootstrap.sh's Vault-config step runs, which is itself gated
# on wave 0 (vault) being Synced/Healthy first — so an ExternalSecret that
# needs that role, sitting in wave 0 itself, can never become Healthy in
# time and deadlocks wave 0 forever (this is the root-application hang
# bootstrap.sh used to hit). Moving it to wave 1 removes it from wave 0's
# gate entirely: it's created alongside monitoring-stack instead of ahead
# of it, and any lag until Vault is configured is just ESO retrying with
# its own backoff, not a stuck ArgoCD sync.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-secrets-sa
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: 'http://vault.vault.svc.cluster.local:8200'
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitoring-role
          serviceAccountRef:
            name: grafana-secrets-sa
            namespace: monitoring
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-monitoring
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: secret/data/monitoring/grafana
        property: admin-password
    - secretKey: admin-user
      remoteRef:
        key: secret/data/monitoring/grafana
        property: admin-user
