apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Must install (and its CRDs must land) before anything using
    # ClusterSecretStore/ExternalSecret — see argocd-repo-secret.yaml.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.external-secrets.io'
    chart: external-secrets
    # 2.x is required for EKS 1.35 (0.10.x was only supported up to 1.31,
    # see external-secrets.io/main/introduction/stability-support). 2.x no
    # longer serves the v1beta1 API (crds.unsafeServeV1Beta1 defaults to
    # false), so every ClusterSecretStore/ExternalSecret in this repo uses
    # external-secrets.io/v1.
    targetRevision: 2.14.0
    helm:
      values: |
        installCRDs: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # See k8s/root-app.yaml for why: retry transient failures instead of
    # leaving the sync failed until the next selfHeal pass.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
