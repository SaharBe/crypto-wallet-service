apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/SaharBe/crypto-wallet-service.git'
    targetRevision: HEAD
    path: k8s/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ClusterSecretStore/ExternalSecret CRDs (installed by the external-secrets
      # Application, wave 0) don't exist on first sync. Without this, ArgoCD's
      # pre-sync validation fails on those resources and aborts the whole
      # operation before wave 0 ever runs.
      - SkipDryRunOnMissingResource=true
