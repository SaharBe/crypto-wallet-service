apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: crypto-wallet-app
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: 079000477935.dkr.ecr.us-east-1.amazonaws.com/order-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        
        env:
        - name: PORT
          value: "3000"
        - name: KAFKA_BROKERS
          value: "kafka-controller-0.kafka-controller-headless.kafka.svc.cluster.local:9092"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: crypto-wallet-app
  labels:
    app: order-service
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: order-service