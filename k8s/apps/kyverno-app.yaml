apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # Chart 3.9.x = Kyverno v1.19, the only release Kyverno supports on
    # Kubernetes 1.35 (kyverno.io/docs/installation/releases: v1.33-v1.35).
    # This chart no longer uses the bitnami/kubectl hook images that 3.2.0
    # needed `tag: latest` overrides for; its hooks run Kyverno's own
    # images, tagged with the chart's appVersion.
    targetRevision: 3.9.2
    helm:
      values: |
        admissionController:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # No RespectIgnoreDifferences/ignoreDifferences here: `helm template`
    # against this exact chart+values confirms it renders no
    # MutatingWebhookConfiguration/ValidatingWebhookConfiguration or other
    # resource with fields a controller mutates post-apply — those get
    # created by Kyverno's own controller entirely outside this chart's
    # manifest, so ArgoCD never tracks them and there's nothing here to
    # ignore. The actual runtime-drift problem is on the ClusterPolicy
    # resources this chart's CRDs enable — see kyverno-policies-app.yaml.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # See k8s/root-app.yaml for why: retry transient failures instead of
    # leaving the sync failed until the next selfHeal pass.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
