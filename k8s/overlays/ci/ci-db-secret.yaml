# Stands in for the Vault-backed ExternalSecret (k8s/components/external-secret.yaml)
# on CI's ephemeral Kind cluster, which has no Vault or External Secrets
# Operator running. Keys match postgres.yaml's POSTGRES_USER/POSTGRES_PASSWORD
# exactly, so order-service/wallet-service authenticate against the real
# Postgres this overlay also deploys.
apiVersion: v1
kind: Secret
metadata:
  name: crypto-db-secret
  namespace: crypto-wallet-app
type: Opaque
stringData:
  DB_USER: myuser
  DB_PASSWORD: mypassword
