# The Applications that live in THIS repo (crypto-wallet-app,
# monitoring-custom) used to be near-identical Application manifests, each
# repeating repoURL. They're collapsed here into one ApplicationSet so the
# repository URL is declared exactly once (in the template's
# `source.repoURL`); a list-generator element then only varies the bits that
# actually differ per app — its name, the path it syncs, and the destination
# namespace.
#
# kyverno-policies used to be a third element here, but it needed its own
# sync-wave (to come up strictly after the `kyverno` Application's CRDs are
# registered) and its own ignoreDifferences (Kyverno's policy-mutating-
# webhook injects defaults into every ClusterPolicy it admits, which ArgoCD
# otherwise flags as permanent drift) — neither of which an ApplicationSet
# template can vary per element without a second generator dimension just
# for one app. It now lives in kyverno-policies-app.yaml instead; see that
# file's header for the full story.
#
# ArgoCD syncs k8s/apps/ straight from git, so there's no `envsubst` step in
# this path (unlike k8s/root-app.yaml). The ApplicationSet template IS the
# single source of truth for these; keep it in sync with the REPO_URL in
# secrets.env.
#
# syncOptions are unified to the superset the apps need:
#   - CreateNamespace=true           monitoring namespace (no-op for the
#                                    pre-existing `default` namespace).
#   - SkipDryRunOnMissingResource=true
#                                    crypto-wallet-app's external-secret.yaml
#                                    references a CRD installed by a separate
#                                    Application, so its first sync would
#                                    otherwise fail pre-sync validation.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: crypto-wallet-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: crypto-wallet-app
            path: k8s/components
            namespace: default
          - name: monitoring-custom
            path: k8s/apps/monitoring
            namespace: monitoring
  template:
    metadata:
      name: '{{ .name }}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: 'https://github.com/SaharBe/crypto-wallet-service.git'
        targetRevision: HEAD
        path: '{{ .path }}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        # See k8s/root-app.yaml for why: retry transient failures (e.g.
        # crypto-wallet-app's ExternalSecret not resolved from Vault yet)
        # instead of leaving the sync failed until the next selfHeal pass.
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
