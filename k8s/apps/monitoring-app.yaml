apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  annotations:
    # Grafana's Deployment (via existingSecret: grafana-admin-credentials)
    # needs that Secret to exist before its pod can start. The Secret comes
    # from k8s/apps/grafana-secret.yaml's ExternalSecret, which is pinned to
    # this same wave ("1") rather than the default wave (0) — see that
    # file's comment. Sharing a wave means both are created together, so
    # this Application never has to wait behind an ExternalSecret that
    # can't turn Healthy until Vault is configured.
    #
    # Vault's monitoring-role (created by `terraform apply` in
    # terraform/vault-config, a bootstrap.sh shell step outside ArgoCD's
    # sync) may still not exist yet when this wave runs. If so, ESO retries
    # with backoff and the Secret appears a little later — bootstrap.sh's
    # final step restarts the Grafana deployment and waits on this
    # Application's health after that terraform apply completes, same as it
    # already does for crypto-wallet-app.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 65.0.0
    helm:
      values: |
        grafana:
          admin:
            existingSecret: "grafana-admin-credentials"
            userKey: "admin-user"
            passwordKey: "admin-password"
          service:
            type: ClusterIP
        prometheus:
          prometheusSpec:
            retention: 2d
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # See k8s/root-app.yaml for why: retry transient failures (e.g. Grafana's
    # existingSecret not landed yet) instead of leaving the sync failed until
    # the next selfHeal pass.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m