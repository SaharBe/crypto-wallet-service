apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # ${REPO_URL} is substituted by bootstrap.sh (`envsubst`) before this
    # manifest is applied — see secrets.env for the canonical value. This
    # file is applied imperatively, never synced by ArgoCD, so envsubst is
    # sufficient here.
    repoURL: '${REPO_URL}'
    targetRevision: HEAD
    path: k8s/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ClusterSecretStore/ExternalSecret CRDs (installed by the external-secrets
      # Application, wave 0) don't exist on first sync. Without this, ArgoCD's
      # pre-sync validation fails on those resources and aborts the whole
      # operation before wave 0 ever runs.
      - SkipDryRunOnMissingResource=true
    # A cold-cluster sync operation can hit a resource that's transiently
    # not-ready yet (a CRD not registered, a namespace not created, Vault
    # still warming up) — retry with backoff instead of leaving the whole
    # App-of-Apps sync failed until the next selfHeal pass notices drift.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
