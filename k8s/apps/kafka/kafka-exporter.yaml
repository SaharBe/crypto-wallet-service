# danielqsj/kafka-exporter, not the bitnami/kafka chart's own metrics.jmx
# toggle: that JMX exporter only re-exposes Kafka's internal JMX beans
# (kafka_server_*, kafka_network_*, ...), it has no concept of consumer
# group offsets at all. kafka_consumergroup_lag and
# kafka_topic_partition_current_offset — what this task needs in
# Prometheus — are metric names this standalone exporter computes itself
# by querying the broker's consumer-group/offset APIs directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: kafka
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      # Non-root (PLAT-512): the image already runs as `nobody`; pinning the
      # uid lets runAsNonRoot verify it, and busybox's nc needs no privilege
      # either.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      # kafka_exporter exits at startup (klog.Fatal "Error Init Kafka
      # Client") if no broker answers, which the probes can't help with.
      # Waiting here turns "broker not up yet" into a pending init instead
      # of a crash loop with up to 5 minutes of back-off after it's back.
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - until nc -z -w 3 kafka.kafka.svc.cluster.local 9092; do echo "waiting for kafka:9092"; sleep 5; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "8Mi"
              cpu: "5m"
            limits:
              memory: "16Mi"
              cpu: "50m"
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.10.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            # Same stable Service DNS as every other in-cluster Kafka
            # client (see k8s/components/wallet-service.yaml) rather than
            # the kafka-controller-0 pod FQDN, so a controller restart
            # doesn't take this exporter down with it.
            - --kafka.server=kafka.kafka.svc.cluster.local:9092
          ports:
            - name: metrics
              containerPort: 9308
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "150m"
          # /healthz only answers "ok" from the HTTP server (no Kafka call).
          # /metrics queries the broker on every request and blocks past the
          # probe timeout while the broker is down, so a liveness probe on it
          # restarted a perfectly healthy exporter into CrashLoopBackOff on
          # every broker restart. Liveness is for a hung process only.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9308
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          # Readiness stays on /metrics: while the broker is unreachable
          # there's nothing useful to scrape, so NotReady is the right state.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: kafka
  labels:
    app: kafka-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9308
      targetPort: metrics
      protocol: TCP
  selector:
    app: kafka-exporter
