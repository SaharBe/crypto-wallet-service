apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-wallet-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/SaharBe/crypto-wallet-service.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true