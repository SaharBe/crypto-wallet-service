# Hands ArgoCD's own repository credential over to Vault/ESO, so it's no
# longer a plaintext Secret manifest in git. There's an unavoidable bootstrap
# chicken-and-egg here: ArgoCD needs *some* repo credential to sync this very
# file from the private repo in the first place. bootstrap.sh seeds that
# credential imperatively (kubectl, from a local untracked secrets.env) before
# ArgoCD's first sync; once Vault + ESO are up, the ExternalSecret below
# takes ownership of the same Secret object and keeps it in sync from Vault
# from that point on — see bootstrap.sh comments for the exact sequencing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-repo-reader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-argocd-repo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: 'http://vault.vault.svc.cluster.local:8200'
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: argocd-repo-role
          serviceAccountRef:
            name: argocd-repo-reader
            namespace: argocd
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo-external-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-argocd-repo
    kind: ClusterSecretStore
  target:
    name: private-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: 'https://github.com/SaharBe/crypto-wallet-service.git'
  data:
    - secretKey: username
      remoteRef:
        key: argocd-repo-creds
        property: username
    - secretKey: password
      remoteRef:
        key: argocd-repo-creds
        property: password
