# Wires Grafana's admin credentials into Vault via ESO. Lives directly under
# k8s/apps (applied as raw manifests by root-app, same pattern as
# argocd-repo-secret.yaml) rather than k8s/components, because
# k8s/components/kustomization.yaml pins a blanket `namespace:
# crypto-wallet-app` transform that would silently relocate this
# ExternalSecret out of the `monitoring` namespace.
#
# Auths as terraform/vault-config's module "monitoring" role, which is the
# only role/policy scoped to read secret/data/monitoring/grafana —
# crypto-app-role (used by ClusterSecretStore/vault-crypto-app) is not, and
# using it here is what produced the 403 permission denied.
#
# monitoring-role's bound_service_account_namespaces includes "monitoring"
# but not "external-secrets", so this must set an explicit
# serviceAccountRef into that namespace rather than falling back to the ESO
# controller's own default ServiceAccount.
#
# Note: the `monitoring` namespace itself is created by the monitoring-stack
# Application (a separate, independently-reconciled Application), not by
# root-app. If this syncs before that namespace exists, ArgoCD's automated
# self-heal will retry until it does — same tolerated race as the CRD
# ordering described on root-app's SkipDryRunOnMissingResource.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-secrets-sa
  namespace: monitoring
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-monitoring
spec:
  provider:
    vault:
      server: 'http://vault.vault.svc.cluster.local:8200'
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitoring-role
          serviceAccountRef:
            name: grafana-secrets-sa
            namespace: monitoring
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-monitoring
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: secret/data/monitoring/grafana
        property: admin-password
    - secretKey: admin-user
      remoteRef:
        key: secret/data/monitoring/grafana
        property: admin-user
