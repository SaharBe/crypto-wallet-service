apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: crypto-wallet-app
  labels:
    app: wallet-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
        - name: wallet-service
          image: 079000477935.dkr.ecr.us-east-1.amazonaws.com/wallet-service:001ddc0beaec474ef6349ccda6d1ada365fe34fa
          imagePullPolicy: Always
          resources:
            requests:
              memory: "192Mi"
              cpu: "150m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            # See order-service.yaml's livenessProbe comment: same fix for
            # the same default-1s-timeout-under-CPU-contention issue.
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          env:
            # Stable Service DNS, not a specific pod ordinal: the ordinal
            # FQDN only exists while that exact pod is up, so a restart of
            # kafka-controller-0 (new pod IP, brief unavailability while
            # KRaft re-elects) leaves the seed broker unreachable until the
            # next DNS TTL refresh instead of failing over immediately.
            - name: KAFKA_BROKERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: DB_HOST
              value: "postgres-service.crypto-wallet-app.svc.cluster.local"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: crypto-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crypto-db-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              value: "mydb"
            - name: DB_PORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: crypto-wallet-app
  labels:
    app: wallet-service
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: wallet-service            