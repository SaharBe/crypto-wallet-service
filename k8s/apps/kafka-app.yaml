apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'registry-1.docker.io/bitnamicharts'
    chart: kafka
    targetRevision: 32.4.3
    helm:
      values: |
        # docker.io/bitnami/* images were discontinued (Bitnami moved to a
        # paid "Secure Images" tier in 2025) - docker.io/bitnami/kafka now has
        # zero tags. bitnamilegacy/* is the frozen last-free-version mirror.
        # Only the main image is active with our config (metrics/volume-
        # permissions/autoDiscovery/provisioning are all disabled by default
        # in this chart, so their bitnami/* images are never pulled) - if you
        # enable any of those later, they'll need the same registry override.
        image:
          repository: bitnamilegacy/kafka
        # This chart defaults every listener to SASL_PLAINTEXT (auth
        # required). Matching this project's existing posture (Vault dev
        # mode, static root token) - PLAINTEXT everywhere, no client
        # credentials to manage, for a learning/portfolio deployment.
        listeners:
          client:
            protocol: PLAINTEXT
          controller:
            protocol: PLAINTEXT
          interbroker:
            protocol: PLAINTEXT
        # Chart 32.x dropped Zookeeper and the kraft.enabled toggle entirely —
        # KRaft is now the only mode. Single combined controller+broker node
        # for a learning setup (default is 3 controller-only + 0 broker nodes).
        controller:
          replicaCount: 1
          persistence:
            enabled: false
          # NOTE: this chart version has no `extraConfig` key - it's silently
          # ignored by Helm (unknown values keys don't error), which is why
          # these settings were never actually reaching server.properties.
          # The real key is `overrideConfiguration` (a map, not a raw string
          # block). Confirmed via `helm template` before committing.
          overrideConfiguration:
            offsets.topic.replication.factor: "1"
            transaction.state.log.replication.factor: "1"
            transaction.state.log.min.isr: "1"
        broker:
          replicaCount: 0
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true