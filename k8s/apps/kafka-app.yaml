apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'registry-1.docker.io/bitnamicharts'
    chart: kafka
    targetRevision: 32.4.3
    helm:
      values: |
        # docker.io/bitnami/* images were discontinued (Bitnami moved to a
        # paid "Secure Images" tier in 2025) - docker.io/bitnami/kafka now has
        # zero tags. bitnamilegacy/* is the frozen last-free-version mirror.
        # Only the main image is active with our config (metrics/volume-
        # permissions/autoDiscovery/provisioning are all disabled by default
        # in this chart, so their bitnami/* images are never pulled) - if you
        # enable any of those later, they'll need the same registry override.
        image:
          repository: bitnamilegacy/kafka
        # This chart defaults every listener to SASL_PLAINTEXT (auth
        # required). Matching this project's existing posture (Vault dev
        # mode, static root token) - PLAINTEXT everywhere, no client
        # credentials to manage, for a learning/portfolio deployment.
        listeners:
          client:
            protocol: PLAINTEXT
          controller:
            protocol: PLAINTEXT
          interbroker:
            protocol: PLAINTEXT
        # Chart 32.x dropped Zookeeper and the kraft.enabled toggle entirely —
        # KRaft is now the only mode. Single combined controller+broker node
        # for a learning setup (default is 3 controller-only + 0 broker nodes).
        controller:
          replicaCount: 1
          # Was `enabled: false` (ephemeral, container filesystem only) —
          # the cluster had no working block-storage provisioner until
          # terraform/infra/ebs-csi.tf installed the aws-ebs-csi-driver
          # addon and k8s/apps/ebs-storageclass.yaml added a CSI-backed
          # StorageClass. 8Gi is the chart's own default size.
          persistence:
            enabled: true
            storageClass: "gp3"
          # NOTE: this chart version has no `extraConfig` key - it's silently
          # ignored by Helm (unknown values keys don't error), which is why
          # these settings were never actually reaching server.properties.
          # The real key is `overrideConfiguration` (a map, not a raw string
          # block). Confirmed via `helm template` before committing.
          overrideConfiguration:
            offsets.topic.replication.factor: "1"
            transaction.state.log.replication.factor: "1"
            transaction.state.log.min.isr: "1"
        broker:
          replicaCount: 0
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kafka
  # The chart generates the KRaft cluster-id and controller-0-id into the
  # kafka-kraft Secret, reusing existing values via Helm `lookup`. ArgoCD
  # renders with `helm template`, where `lookup` returns nothing, so every
  # fresh render produces new random IDs, a new checksum/secret on the pod
  # template, and a broker rollout (confirmed live: 5 rollouts in the first
  # 5 minutes of a `make up`, the checksum the only field that changed).
  # Ignoring both keeps the IDs from the first sync for the cluster's
  # lifetime, which also keeps them matching meta.properties on the PVC.
  # controller-0-id can't be pinned via values (the chart hardcodes it as
  # generated), so setting `clusterId` alone wouldn't be enough.
  ignoreDifferences:
    - kind: Secret
      name: kafka-kraft
      namespace: kafka
      jsonPointers:
        - /data
    - group: apps
      kind: StatefulSet
      name: kafka-controller
      namespace: kafka
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Without this, ignoreDifferences only hides the drift from the diff;
      # a sync triggered for any other reason would still push new IDs.
      - RespectIgnoreDifferences=true
    # See k8s/root-app.yaml for why: retry transient failures instead of
    # leaving the sync failed until the next selfHeal pass.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
